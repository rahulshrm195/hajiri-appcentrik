<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hajiri — Offline</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#047857,#059669); color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; }
  .icon { width:72px; height:72px; background:rgba(255,255,255,0.15); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto; }
  h1 { font-size:24px; font-weight:800; margin-top:8px; }
  p { color:rgba(255,255,255,0.75); font-size:14px; max-width:280px; line-height:1.6; }
  button { background:#F59E0B; color:#fff; border:none; border-radius:14px; padding:13px 32px; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; box-shadow:0 4px 12px rgba(245,158,11,0.4); }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're Offline</h1>
  <p>Hajiri needs an internet connection to sync your attendance data. Please check your connection and try again.</p>
  <button onclick="location.reload()">Try Again</button>
</body>
</html>
